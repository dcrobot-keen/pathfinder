<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>실내 지도 - LiDAR PCD Viewer</title>
  </head>
  <body>
    <div id="app-title">
      Robot Orchestration Toolchain <span id="app-title-version">v0.7</span>
    </div>
    <div id="tabs">
      <label class="pcd-upload">
        PCD 업로드
        <input id="pcd-file-input" type="file" accept=".pcd" />
      </label>
      <div id="pcd-status" class="pcd-status"></div>
      <button id="tab-3d" class="tab-button" data-tab="3d">3D 뷰</button>
      <button id="tab-2d" class="tab-button active" data-tab="2d">2D 뷰</button>
      <button id="tab-robots" class="tab-button" data-tab="robots">로봇 등록</button>
      <button id="tab-pf-obstacle" class="tab-button" data-tab="pf-obstacle">길찾기 (장애물)</button>
    </div>
    <div id="map" class="view active" data-view="2d">
      <div id="slice-panel"></div>
      <div id="edit-panel"></div>
    </div>
    <div id="view3d" class="view" data-view="3d">
      <div id="mesh-panel">
        <div class="mesh-buttons">
          <button id="btn-view-points" class="mesh-button active">포인트</button>
          <button id="btn-view-mesh" class="mesh-button">메쉬로 변환</button>
        </div>
        <div id="mesh-status" class="mesh-status"></div>
      </div>
    </div>
    <div id="pf-obstacle" class="view" data-view="pf-obstacle">
      <div id="pf-obstacle-panel"></div>
    </div>
    <div id="robots" class="view" data-view="robots"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
