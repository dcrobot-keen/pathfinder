<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathfinder</title>
  </head>
  <body>
    <div id="app-title">
      Pathfinder <span id="app-title-version">v0.7</span>
    </div>
    <div id="tabs">
      <div id="project-selector"></div>
      <label class="pcd-upload">
        PCD 업로드
        <input id="pcd-file-input" type="file" accept=".pcd" />
      </label>
      <div id="pcd-status" class="pcd-status"></div>
      <button id="tab-maps" class="tab-button active" data-tab="maps">지도</button>
      <button id="tab-robots" class="tab-button" data-tab="robots">로봇</button>
      <button id="tab-operate" class="tab-button" data-tab="operate">운영</button>
      <button id="tab-simulation" class="tab-button" data-tab="simulation">시뮬레이션</button>
      <button id="tab-settings" class="tab-button" data-tab="settings">설정</button>
      <div id="maps-subtabs" class="subtab-bar">
        <button class="subtab active" data-sub="2d">2D</button>
        <button class="subtab" data-sub="3d">3D</button>
        <button class="subtab" data-sub="studio">정합(스튜디오)</button>
      </div>
    </div>
    <div id="map" class="view active" data-view="2d">
      <div id="slice-panel"></div>
      <div id="edit-panel"></div>
      <div id="imported-obstacles-panel"></div>
    </div>
    <div id="view3d" class="view" data-view="3d">
      <div id="mesh-panel">
        <div class="mesh-buttons">
          <button id="btn-view-points" class="mesh-button active">포인트</button>
          <button id="btn-view-mesh" class="mesh-button">메쉬로 변환</button>
        </div>
        <div id="mesh-status" class="mesh-status"></div>
      </div>
    </div>
    <div id="view-studio" class="view" data-view="studio">
      <div class="studio-embed-container">
        <div class="studio-embed-bar">
          <div class="studio-embed-info">
            <span class="studio-embed-title">정합 스튜디오 (scan-to-map-studio)</span>
            <span class="studio-embed-desc">LiDAR 스캔 ICP 정합 및 슬라이스맵 발행</span>
          </div>
          <div class="studio-embed-actions">
            <button id="btn-studio-refresh" class="robot-button">프로젝트 목록 새로고침</button>
            <a id="link-studio-external" class="settings-service-link" href="http://localhost:8000/groups" target="_blank" rel="noopener">새 창으로 열기 ↗</a>
          </div>
        </div>
        <iframe id="studio-frame" src="http://localhost:8000/groups" title="Scan to Map Studio"></iframe>
      </div>
    </div>
    <div id="operate" class="view" data-view="operate">
      <div id="operate-panel"></div>
    </div>
    <div id="simulation" class="view" data-view="simulation">
      <div id="simulation-panel"></div>
      <div id="simulation-viewer-wrap">
        <div class="viewer-embed-bar">
          <span class="viewer-embed-title">3D 시뮬레이터</span>
          <div class="viewer-bot-selector">
            <button class="sim-bot-btn active" data-url="http://localhost:8767">tb3-sim-01 (:8767)</button>
            <button class="sim-bot-btn" data-url="http://localhost:8777">tb3-sim-02 (:8777)</button>
          </div>
          <button id="btn-viewer-toggle" class="sim-viewer-toggle-btn">3D 접기</button>
          <a id="link-sim-external" class="settings-service-link" href="http://localhost:8767" target="_blank" rel="noopener">열기 ↗</a>
        </div>
        <iframe id="sim-frame" src="http://localhost:8767" title="Robot Simulator 3D View"></iframe>
      </div>
    </div>
    <div id="robots" class="view" data-view="robots"></div>
    <div id="settings" class="view" data-view="settings"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
