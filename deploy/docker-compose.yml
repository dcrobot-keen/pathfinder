# 보통 사용(기본) · 공유 인프라: GHCR 에서 미리 빌드된 이미지를 받아온다. simulator/robot-os-chromium 소스를 로컬에
# 체크아웃할 필요가 없다 -- fleet-studio 하나만 clone 하면 된다. 이미지는 .github/workflows/stack-image.yml 이 두
# 저장소로부터 빌드해 ghcr.io/dcrobot-keen/fleet-studio-stack 로 push 한다.
#
# 여기 있는 건 mosquitto · 대시보드 · 시그널링뿐이다 -- 현장마다 새로 띄울 이유가 없는 것들만. 시뮬레이터(현장별
# 월드 + 로봇)는 deploy/docker-compose.site.yml 을 현장마다 별도 compose 프로젝트로 띄운다(설정 › 시뮬레이터 카드,
# server/simControl.mjs). simulator 소스를 직접 고칠 때는 docker-compose.dev.yml + docker-compose.site.dev.yml
# (형제 저장소를 바인드 마운트해 즉시 빌드)을 대신 쓴다.
#
#   npm run stack:up                           # = docker compose -f deploy/docker-compose.yml up -d
#   npm run stack:pull  (새 이미지로 갱신) / stack:down / stack:logs
#
# 포트(모두 127.0.0.1 만): 1883/9001 MQTT · 5173 대시보드 · 9770 시그널링. 시뮬레이터 포트는 현장마다 다르다
# (설정 › 시뮬레이터 카드가 배정 -- site.yml 참고).

name: fleet-studio

x-image: &image
  image: ghcr.io/dcrobot-keen/fleet-studio-stack:${STACK_TAG:-latest}

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"   # MQTT (호스트의 pathfinder API, 컨테이너 -- 현장별 sim-driver 도 host.docker.internal 로 이 포트에 붙는다)
      - "127.0.0.1:9001:9001"   # MQTT over WebSocket (호스트 브라우저 페이지)
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  dashboard:
    <<: *image
    working_dir: /app/robot-os-chromium
    command: ["node", "scripts/serve-dashboard.mjs"]
    environment:
      DASHBOARD_PORT: "5173"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./worlds:/app/simulator/worlds:ro

  signaling:
    <<: *image
    working_dir: /app/robot-os-chromium/apps/signaling-server
    command: ["node", "src/index.js"]
    environment:
      SIGNALING_PORT: "9770"
    ports:
      - "127.0.0.1:9770:9770"
