# Mosquitto for the local VDA5050 loop (doc/vda5050-rcs.md). Development
# only: anonymous, no TLS. 1883 = plain MQTT for containers (sim-driver),
# 9001 = MQTT over WebSocket for the host browser / pathfinder's server.
listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
